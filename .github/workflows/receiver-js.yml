name: Receiver JavaScript checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  receiver-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate receiver inline JavaScript
        run: |
          node tests/receiver-syntax.cjs
          node tests/receiver-static.cjs
          node tests/receiver-behavior.cjs
