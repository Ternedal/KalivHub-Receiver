name: Build isolated Nest Hub mic probe
on:
  push:
    branches: [test/nest-hub-microphone-probe]
  workflow_dispatch:
  pull_request:
    paths:
      - 'mic-diagnostic.html'
      - 'tests/mic-probe-*.cjs'
      - 'tests/test_mic_probe_launcher.py'
      - 'tools/launch_mic_probe.py'
      - '.github/workflows/mic-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated receiver HTML
        run: |
          test -s mic-diagnostic.html
          node --check tests/mic-probe-static.cjs
          node tests/mic-probe-static.cjs
          node tests/mic-probe-behavior.cjs
          node tests/mic-probe-errors.cjs
          node tests/mic-probe-empty-stream.cjs
          node tests/mic-probe-stale-timeout.cjs
          node tests/mic-probe-manual-stop.cjs
          node tests/mic-probe-stale-meter.cjs
          node tests/mic-probe-suspended-audio.cjs
      - name: Check Python Cast launcher
        run: |
          python -m compileall -q tools/launch_mic_probe.py tests/test_mic_probe_launcher.py
          python -m unittest discover -s tests -p 'test_mic_probe_launcher.py' -v
      - name: Validate launcher against installed pychromecast API
        run: |
          python -m pip install 'pychromecast>=13,<15'
          python -c "import pychromecast; assert callable(getattr(pychromecast, 'get_chromecast_from_host', None)), 'Missing get_chromecast_from_host API'"
      - name: Package only diagnostic receiver
        run: |
          mkdir -p dist
          cp mic-diagnostic.html dist/index.html
          node tests/mic-probe-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kalivhub-nest-mic-probe
          path: dist/
          if-no-files-found: error
          retention-days: 7
