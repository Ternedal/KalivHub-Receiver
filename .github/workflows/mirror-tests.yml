name: KalivHub mirror offline tests
on:
  pull_request:
    paths:
      - tools/kalivhub_mirror_server.py
      - tests/test_kalivhub_mirror_server.py
      - .github/workflows/mirror-tests.yml
  push:
    branches: [test/nest-hub-microphone-probe]
    paths:
      - tools/kalivhub_mirror_server.py
      - tests/test_kalivhub_mirror_server.py
      - .github/workflows/mirror-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: python -m py_compile tools/kalivhub_mirror_server.py
      - name: Run offline security and HTTP contract tests
        run: python -m unittest discover -s tests -p test_kalivhub_mirror_server.py -v
