name: KalivHub mirror offline tests
on:
  pull_request:
    paths:
      - tools/kalivhub_mirror_server.py
      - tools/start-kalivhub-mirror.ps1
      - tests/test_kalivhub_mirror_server.py
      - .github/workflows/mirror-tests.yml
  push:
    branches: [test/nest-hub-microphone-probe]
    paths:
      - tools/kalivhub_mirror_server.py
      - tools/start-kalivhub-mirror.ps1
      - tests/test_kalivhub_mirror_server.py
      - .github/workflows/mirror-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: python -m py_compile tools/kalivhub_mirror_server.py
      - name: Run offline security and HTTP contract tests
        run: python -m unittest discover -s tests -p test_kalivhub_mirror_server.py -v

  windows-launcher-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run HTTP and security tests against native Windows sockets
        shell: pwsh
        run: |
          python -m py_compile tools/kalivhub_mirror_server.py
          python -m unittest discover -s tests -p test_kalivhub_mirror_server.py -v
      - name: Validate DPAPI PowerShell launcher parses safely
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/start-kalivhub-mirror.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PASS: Windows launcher PowerShell syntax"
      - name: Verify real DPAPI encryption and stable reuse (no receiver)
        shell: pwsh
        run: |
          # Isolated temporary Windows profile directory, never developer secrets.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'kalivhub-mirror-dpapi-fixture'
          & ./tools/start-kalivhub-mirror.ps1 -VerifyKeyOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw 'DPAPI initialization failed'
          }
          $keyPath = Join-Path $env:LOCALAPPDATA 'KalivHub/mirror-secret.dpapi'
          if (-not (Test-Path -LiteralPath $keyPath -PathType Leaf)) {
            throw 'Missing encrypted key file'
          }
          $first = (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash
          $ciphertext = [IO.File]::ReadAllBytes($keyPath)
          if ($ciphertext.Length -lt 64) {
            throw 'Key was not written as DPAPI ciphertext'
          }
          & ./tools/start-kalivhub-mirror.ps1 -VerifyKeyOnly
          $second = (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash
          if ($first -ne $second) {
            throw 'Key unexpectedly rotated on second launch'
          }
          Write-Host 'PASS: DPAPI key generated, encrypted, decrypted and preserved across launches.'
          # Corrupted DPAPI data must fail CLOSED, never silently rotate and
          # leave the already-paired Android client trusting a different key.
          $corrupted = [byte[]](1..32)
          [IO.File]::WriteAllBytes($keyPath, $corrupted)
          $corruptHash = (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash
          $rejected = $false
          try {
            & ./tools/start-kalivhub-mirror.ps1 -VerifyKeyOnly
          } catch {
            if ($_.Exception.Message -notmatch 'Cannot decrypt KalivHub mirror key') {
              throw
            }
            $rejected = $true
          }
          if (-not $rejected -or
              (Get-FileHash -LiteralPath $keyPath -Algorithm SHA256).Hash -ne $corruptHash) {
            throw 'Corrupt key was accepted or silently replaced'
          }
          Write-Host 'PASS: corrupted DPAPI key refused without silent rotation.'
          Remove-Item -LiteralPath $env:LOCALAPPDATA -Recurse -Force
