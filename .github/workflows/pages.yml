name: Deploy Cast receiver to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate receiver before deployment
        # Deploy only what passes every receiver test. Main was red for 12 days
        # while this step ran only the static check and Pages kept deploying.
        run: |
          node tests/receiver-syntax.cjs
          node tests/receiver-static.cjs
          node tests/receiver-behavior.cjs
          node tests/receiver-voice.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
