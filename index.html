<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KalivHub Cast</title>
<style>
:root{font-family:Inter,Arial,Helvetica,sans-serif;color:#f6f9ff;background:#05070d;--kaliv-blue:#1457ff;--kaliv-blue-light:#7da3ff;--kaliv-ink:#0e1116}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 77% 45%,#122b5c,#070d19 48%,#05070d 85%);height:100dvh;overflow:hidden}
.shell{height:100dvh;padding:0 28px 18px;display:grid;grid-template-rows:72px minmax(0,1fr) 88px;gap:8px}.shell:before{content:"";position:absolute;top:0;left:0;width:45%;height:3px;background:linear-gradient(90deg,var(--kaliv-blue),var(--kaliv-blue-light));box-shadow:0 0 18px #1457ff}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #283750}header b{font-size:22px;letter-spacing:.14em;font-weight:800}.micro{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:#91a8cb}.online{font-size:13px;color:#b0c0d8}#indicator{color:#ffb57b}#indicator.ready{color:#62e2b1}#indicator.stale{color:#ffb57b}
main{display:grid;grid-template-columns:53% 47%;min-height:0}.copy{align-self:center}#clock{font-size:clamp(72px,10vw,116px);font-weight:800;letter-spacing:-7px;line-height:1}.rule{width:74px;height:3px;background:var(--kaliv-blue);box-shadow:0 0 14px #1457ff88;margin:14px 0 20px}h1{font-size:clamp(30px,4.6vw,50px);letter-spacing:-2px;margin:0 0 12px}p{color:#aabbd4;font-size:17px;margin:0}.figure{position:relative;display:grid;place-items:center;min-height:0}.halo{position:absolute;border:1px solid #2357a0;width:75%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 75px #0758d744}.ankh{position:relative;width:min(48%,220px);height:82%;max-height:290px;overflow:visible;filter:drop-shadow(0 0 12px #7da3ff) drop-shadow(0 0 26px #1457ff)}.figure .micro{position:absolute;bottom:10px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}button{background:#0b1729;border:1px solid #36557e;border-radius:12px;color:#fff;padding:14px 18px;text-align:left;min-height:64px;touch-action:manipulation}button strong{display:block;font-size:18px}button small{display:block;color:#a8bcd9;margin-top:5px;font-size:12px}button:active{background:#1c4183}button:focus-visible{outline:3px solid var(--kaliv-blue-light);outline-offset:2px}
#panel{display:none;position:absolute;inset:80px 24px 108px;background:#07101f;border-radius:16px;z-index:4;padding:16px;overflow:auto;border:1px solid #27406c}#panel.open{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:25px;margin:0}.head button{min-height:52px;padding:8px 20px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid #324e7b;padding:15px;min-height:98px;background:linear-gradient(145deg,#142944,#0b192e);border-radius:10px}.tile.room-start{margin-top:24px;position:relative}.tile.room-start:before{content:attr(data-room);position:absolute;top:-24px;left:0;font-size:14px;font-weight:700;color:#a9c8ff;white-space:nowrap}.tile strong{font-size:17px;overflow-wrap:anywhere}.tile p{font-size:14px;margin-top:8px}.tile[data-status="on"]{border-color:#3579ce;box-shadow:inset 3px 0 #4c9aff}.tile[data-status="off"]{border-color:#34455d}.tile[data-status="unavailable"]{border-color:#856048}.tile[data-status="unavailable"] p{color:#ffc58f}
@media(max-width:700px){.shell{padding:0 14px 12px;grid-template-rows:60px minmax(0,1fr) 72px}.tiles{grid-template-columns:repeat(2,1fr)}#panel{inset:64px 12px 85px}button{padding:9px}button strong{font-size:15px}button small{font-size:10px}}
@media (min-width:900px) and (max-height:700px){.shell{grid-template-rows:58px minmax(0,1fr) 82px;padding:0 22px 12px;gap:6px}header b{font-size:20px}.copy #clock{font-size:104px}.copy h1{font-size:39px}.copy p{font-size:15px}.halo{width:min(70%,420px)}.ankh{font-size:210px}.figure .micro{bottom:0}nav button{min-height:66px;padding:10px 16px}#panel{inset:65px 22px 98px}.tile{min-height:85px}}
@media (min-width:900px) and (max-height:700px){.online{max-width:44%;text-align:right}#connection{overflow-wrap:anywhere}.head{margin-bottom:10px}.head h2{font-size:23px}.tiles{gap:8px}.tile{padding:12px}.tile strong{font-size:16px}.tile p{font-size:13px;margin-top:6px}nav button strong{font-size:17px}nav button small{font-size:11px}}
</style></head><body><div class="shell"><header><div><b>KALIV</b><div class="micro">MODELRIG / CAST INTERFACE</div></div><div class="online"><span id="indicator">●</span> <span id="connection" role="status" aria-live="polite">Afventer forbindelse</span></div></header>
<main><section class="copy"><div id="clock">--:--</div><div class="rule"></div><h1 id="greeting">Kaliv er her.</h1><p id="subtitle">Dit hjem. Din assistent. Én oplevelse.</p></section><section class="figure"><div class="halo"></div><svg class="ankh" viewBox="0 0 200 260" role="img" aria-label="Kaliv ankh" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ankhGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8e8ff"/><stop offset=".55" stop-color="#54aeff"/><stop offset="1" stop-color="#226bff"/></linearGradient></defs><path d="M100 116 C70 90 55 72 55 48 C55 23 74 9 100 9 C126 9 145 23 145 48 C145 72 130 90 100 116 Z M100 116 V248 M39 158 H161" fill="none" stroke="#0d57d9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M100 116 C70 90 55 72 55 48 C55 23 74 9 100 9 C126 9 145 23 145 48 C145 72 130 90 100 116 Z M100 116 V248 M39 158 H161" fill="none" stroke="url(#ankhGlow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="micro">KALIV / CAST</span></section></main>
<section id="panel" role="region" aria-label="Enhedsoversigt" aria-hidden="true"><div class="head"><h2>Enheder</h2><button id="back">← Tilbage</button></div><div id="tiles" class="tiles"></div></section>
<nav><button id="devices" aria-controls="panel" aria-expanded="false"><strong>ENHEDER</strong><small>Kun visning</small></button><button id="assistant"><strong>KALIV</strong><small>Assistentstatus</small></button><button id="rest"><strong>RO</strong><small>Luk panelet</small></button></nav></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let states=[],lastMessage=0;let lastSeq=-1;let lastSession=null;let snapshotSenderId=null;const pendingControls=new Map();let controlsEnabled=false;let senderId=null;let castContext=null;const CONTROL_NS='urn:x-cast:dk.kalivhub.lab';const MAX_ENTITIES=32;const allowed=new Set(['light','switch','sensor','binary_sensor','camera','climate','cover','fan','input_boolean']);
function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});const h=now.getHours();$('greeting').textContent=h<10?'Godmorgen.':h<17?'Goddag.':'God aften.';if(lastMessage&&Date.now()-lastMessage>45000&&$('indicator').className!=='stale'){$('connection').textContent='Forbindelsen er afbrudt';$('indicator').className='stale';pendingControls.clear();controlsEnabled=false;senderId=null;$('devices').querySelector('small').textContent='Kun visning';render()}}
function safe(item){if(!item||typeof item!=='object'||typeof item.entity_id!=='string'||typeof item.name!=='string'||typeof item.state!=='string')return false;const id=item.entity_id.split('.');return id.length===2&&allowed.has(id[0])&&/^[a-z0-9_]{1,120}$/.test(id[1])&&item.name.length<=128&&item.state.length<=128&&(item.room===undefined||(typeof item.room==='string'&&item.room.length>0&&item.room.length<=64&&!/[\u0000-\u001f\u007f-\u009f]/.test(item.room)))&&(!item.entity_id.startsWith('climate.')||['temperature','current_temperature'].every(k=>item[k]===undefined||(typeof item[k]==='number'&&Number.isFinite(item[k])&&item[k]>=-50&&item[k]<=100)))&&!/[\u0000-\u001f\u007f-\u009f]/.test(item.name+item.state)}
function snapshot(data,sourceSenderId){if(typeof sourceSenderId!=='string'||!sourceSenderId)return;if(typeof data==='string'){try{data=JSON.parse(data)}catch{return}}if(!data||data.type!=='snapshot'||data.version!==1||!Array.isArray(data.entities)||data.entities.length>MAX_ENTITIES||!data.entities.every(safe)||new Set(data.entities.map(item=>item.entity_id)).size!==data.entities.length)return;if(!Number.isSafeInteger(data.sequence)||data.sequence<0)return;if(typeof data.session_id!=='string'||!/^[A-Za-z0-9_-]{8,64}$/.test(data.session_id))return;const session=data.session_id;{if(session!==lastSession||sourceSenderId!==snapshotSenderId){lastSession=session;snapshotSenderId=sourceSenderId;lastSeq=-1;pendingControls.clear();controlsEnabled=false;senderId=null;$('devices').querySelector('small').textContent='Kun visning'}if(data.sequence<=lastSeq)return;lastSeq=data.sequence}states=data.entities.map(x=>({entity_id:x.entity_id,name:x.name,state:x.state,room:x.room||'Andre',current_temperature:x.current_temperature,temperature:x.temperature})).sort((a,b)=>a.room.localeCompare(b.room,'da')||a.name.localeCompare(b.name,'da'));for(const [id,pending] of pendingControls){const current=states.find(x=>x.entity_id===id);if(!current||(pending.temperature!==undefined?current.temperature===pending.temperature:current.state!==pending.original)||Date.now()-pending.at>15000)pendingControls.delete(id)}lastMessage=Date.now();$('connection').textContent='Forbundet · '+states.length+' enheder';$('indicator').className='ready';render()}

// Voice display is separate from HA snapshots and never grants control rights.
let voiceSession=null;
let voiceSenderId=null;
function voiceDisplay(data, senderId){
 if(!data||data.version!==1||typeof data.session_id!=='string'||!/^[A-Za-z0-9_-]{8,64}$/.test(data.session_id))return;
 if(typeof data.message_id!=='string'||!/^[0-9a-fA-F-]{36}$/.test(data.message_id))return;
 if(data.type==='kaliv_voice_status'){
  if(!['listening','thinking','speaking','idle','error'].includes(data.phase))return;
  if(voiceSenderId!==null&&voiceSenderId!==senderId)return;
  if(snapshotSenderId!==null&&snapshotSenderId!==senderId)return;
  voiceSenderId=senderId;
  voiceSession=data.session_id;
  const labels={listening:'Lytter på telefonen',thinking:'Kaliv tænker',speaking:'Kaliv svarer',idle:'Kaliv er klar',error:'Stemmeforbindelsen fejlede'};
  $('subtitle').textContent=labels[data.phase];
  // Acknowledge only after the status has passed sender/session validation
  // and has been applied to the display. This is not an audio-playback ack.
  try{
   const delivery=castContext?.sendCustomMessage(CONTROL_NS,senderId,{
    type:'kaliv_voice_ack',version:1,session_id:voiceSession,message_id:data.message_id,phase:data.phase
   });
   if(delivery&&typeof delivery.catch==='function')delivery.catch(()=>{});
  }catch(_){}
 }else if(data.type==='kaliv_voice_text'){
  if(senderId!==voiceSenderId||data.session_id!==voiceSession||!['user','assistant'].includes(data.role)||typeof data.text!=='string'||data.text.length>4000)return;
  $('subtitle').textContent=data.text;
  // Only acknowledge text after it has passed all validation and been rendered.
  try{
   const delivery=castContext?.sendCustomMessage(CONTROL_NS,senderId,{
    type:'kaliv_voice_ack',version:1,session_id:voiceSession,message_id:data.message_id,
    role:data.role,kind:'text'
   });
   if(delivery&&typeof delivery.catch==='function')delivery.catch(()=>{});
  }catch(_){}
 }
}
function requestControl(item){
 if(!controlsEnabled||!senderId||!castContext||Date.now()-lastMessage>45000)return;
 if(!/^(light|switch|input_boolean)\.[a-z0-9_]{1,120}$/.test(item.entity_id))return;
 if(item.state!=='on'&&item.state!=='off')return;
 const previous=pendingControls.get(item.entity_id);if(previous){if(Date.now()-previous.at<15000)return;pendingControls.delete(item.entity_id)}
 const action=item.state==='on'?'turn_off':'turn_on';
 const request_id='tap-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
 try{
  const delivery=castContext.sendCustomMessage(CONTROL_NS,senderId,{type:'control_request',version:1,request_id,entity_id:item.entity_id,action});
  pendingControls.set(item.entity_id,{original:item.state,request_id,at:Date.now()});
  $('connection').textContent='Kommando sendt · afventer status';
  // CAF may reject asynchronously when the sender disconnects mid-tap.
  if(delivery&&typeof delivery.catch==='function')delivery.catch(()=>{
   if(pendingControls.get(item.entity_id)?.request_id===request_id&&controlsEnabled&&senderId===snapshotSenderId&&Date.now()-lastMessage<=45000){pendingControls.delete(item.entity_id);$('connection').textContent='Kunne ikke sende kommando';render()}
  });
 }catch{$('connection').textContent='Kunne ikke sende kommando'}
}
function requestTemperature(item,delta){
 if(!controlsEnabled||!senderId||!castContext||Date.now()-lastMessage>45000)return;
 if(!/^climate\.[a-z0-9_]{1,120}$/.test(item.entity_id))return;
 if(typeof item.temperature!=='number'||!Number.isFinite(item.temperature))return;
 const previous=pendingControls.get(item.entity_id);if(previous&&Date.now()-previous.at<15000)return;if(previous)pendingControls.delete(item.entity_id);
 const temperature=Math.round((item.temperature+delta)*2)/2;
 if(temperature<5||temperature>35)return;
 const request_id='temp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
 try{
  const delivery=castContext.sendCustomMessage(CONTROL_NS,senderId,{type:'control_request',version:1,request_id,entity_id:item.entity_id,action:'set_temperature',temperature});
  pendingControls.set(item.entity_id,{original:item.state,request_id,at:Date.now(),temperature});
  $('connection').textContent='Temperatur sendt · afventer status';
  if(delivery&&typeof delivery.catch==='function')delivery.catch(()=>{if(pendingControls.get(item.entity_id)?.request_id===request_id&&controlsEnabled&&senderId===snapshotSenderId&&Date.now()-lastMessage<=45000){pendingControls.delete(item.entity_id);$('connection').textContent='Kunne ikke sende temperatur';render()}});
 }catch{$('connection').textContent='Kunne ikke sende temperatur'}
}
function render(){const root=$('tiles');root.replaceChildren();if(!states.length){const p=document.createElement('p');p.textContent=$('indicator').className==='stale'?'Forbindelsen er afbrudt. Afventer nye data.':'Ingen godkendte enheder modtaget';root.append(p);return}let previousRoom=null;for(const item of states){const tile=document.createElement('div');tile.className='tile';if(item.room!==previousRoom){tile.className+=' room-start';tile.dataset.room=item.room;previousRoom=item.room}const status=item.state.toLowerCase();tile.dataset.status=status==='on'||status==='open'||status==='heat'?'on':status==='off'||status==='closed'?'off':status==='unavailable'||status==='unknown'?'unavailable':'neutral';const name=document.createElement('strong');name.textContent=item.name;const state=document.createElement('p');state.textContent=item.state;tile.append(name,state);if(item.entity_id.startsWith('camera.')){const camera=document.createElement('p');camera.textContent=status==='unavailable'?'Kamera offline · ingen stream':'Kamera · livevisning kræver sikker streamforbindelse';tile.append(camera)}if(item.entity_id.startsWith('climate.')){const climate=document.createElement('p');const fmt=v=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('da-DK')+' °C':null;const current=fmt(item.current_temperature),target=fmt(item.temperature);climate.textContent=[current?'Nu '+current:null,target?'Mål '+target:null].filter(Boolean).join(' · ')||'Temperaturdata afventer';tile.append(climate);if(controlsEnabled&&typeof item.temperature==='number'&&Number.isFinite(item.temperature)){for(const [label,delta] of [['−',-0.5],['+',0.5]]){const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-label',(delta<0?'Sænk':'Hæv')+' måltemperatur for '+item.name);button.onclick=event=>{if(event&&typeof event.stopPropagation==='function')event.stopPropagation();requestTemperature(item,delta)};tile.append(button)}}}if(controlsEnabled&&/^(light|switch|input_boolean)\.[a-z0-9_]{1,120}$/.test(item.entity_id)&&(status==='on'||status==='off')){tile.setAttribute('role','button');tile.setAttribute('tabindex','0');tile.setAttribute('aria-label',item.name+' · '+(status==='on'?'Sluk':'Tænd'));tile.onclick=()=>requestControl(item);tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();requestControl(item)}}}root.append(tile)}}
function closePanel(){$('panel').classList.remove('open');$('panel').setAttribute('aria-hidden','true');$('devices').setAttribute('aria-expanded','false')}$('devices').onclick=()=>{$('panel').classList.add('open');$('panel').setAttribute('aria-hidden','false');$('devices').setAttribute('aria-expanded','true');render()};$('back').onclick=$('rest').onclick=closePanel;document.addEventListener('keydown',event=>{if(event.key==='Escape')closePanel()});$('assistant').onclick=()=>{closePanel();$('subtitle').textContent='Cast-visning aktiv. Talefunktion kræver ModelRig-forbindelse.'};

// Nest Hub touch workaround: coordinate-based hit testing, without on-screen diagnostics.
let lastTouchAction=0;
function touchButtonAt(x,y){
 if(!Number.isFinite(x)||!Number.isFinite(y))return null;
 for(const id of ['devices','assistant','rest','back']){
  const btn=$(id);if(!btn||!btn.getClientRects().length)continue;
  const r=btn.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return btn;
 }
 if(controlsEnabled&&$('panel').classList.contains('open')){
  for(const tile of $('tiles').children){for(const child of tile.children){if(child.tagName!=='BUTTON')continue;const b=child.getBoundingClientRect();if(x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom)return child}if(tile.getAttribute('role')!=='button')continue;const r=tile.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return tile}
 }
 return null;
}
function handleTouch(event){
 const point=event.changedTouches&&event.changedTouches[0]||event;
 if(!point)return;
 const hit=touchButtonAt(point.clientX,point.clientY);
 if(!hit||Date.now()-lastTouchAction<650)return;
 lastTouchAction=Date.now();
 hit.click();

}
document.addEventListener('touchstart',handleTouch,{capture:true,passive:true});
document.addEventListener('touchend',handleTouch,{capture:true,passive:true});
document.addEventListener('pointerdown',handleTouch,{capture:true,passive:true});
tick();setInterval(tick,5000);
try{if(!window.cast||!cast.framework)throw Error('Cast SDK unavailable');const ctx=cast.framework.CastReceiverContext.getInstance();castContext=ctx;ctx.addCustomMessageListener(CONTROL_NS,event=>{if(!event||!event.data)return;const data=event.data;if(data&&(data.type==='kaliv_voice_status'||data.type==='kaliv_voice_text')){voiceDisplay(data,event.senderId);return}if(data&&data.type==='control_capabilities'&&data.version===1&&typeof event.senderId==='string'){const fresh=lastSession!==null&&lastMessage>0&&Date.now()-lastMessage<=45000;if(event.senderId!==snapshotSenderId)return;controlsEnabled=data.enabled===true&&fresh;senderId=controlsEnabled?event.senderId:null;$('devices').querySelector('small').textContent=controlsEnabled?'Tryk for at styre':'Kun visning';render();return}snapshot(data,event.senderId)});ctx.start({uiConfig:{touchScreenOptimizedApp:true}});$('connection').textContent='Receiver klar · afventer data'}catch{$('connection').textContent='Cast SDK ikke tilgængeligt'}
})();
</script></body></html>
