<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KalivHub Cast</title>
<style>
:root{font-family:Inter,Arial,Helvetica,sans-serif;color:#f6f9ff;background:#05070d;--kaliv-blue:#1457ff;--kaliv-blue-light:#7da3ff;--kaliv-ink:#0e1116}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 77% 45%,#122b5c,#070d19 48%,#05070d 85%);height:100dvh;overflow:hidden}
.shell{height:100dvh;padding:0 28px 18px;display:grid;grid-template-rows:72px minmax(0,1fr) 88px;gap:8px}.shell:before{content:"";position:absolute;top:0;left:0;width:45%;height:3px;background:linear-gradient(90deg,var(--kaliv-blue),var(--kaliv-blue-light));box-shadow:0 0 18px #1457ff}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #283750}header b{font-size:22px;letter-spacing:.14em;font-weight:800}.micro{font:11px ui-monospace,monospace;letter-spacing:1.5px;color:#91a8cb}.online{font-size:13px;color:#b0c0d8}#indicator{color:#ffb57b}#indicator.ready{color:#62e2b1}
main{display:grid;grid-template-columns:53% 47%;min-height:0}.copy{align-self:center}#clock{font-size:clamp(72px,10vw,116px);font-weight:800;letter-spacing:-7px;line-height:1}.rule{width:74px;height:3px;background:var(--kaliv-blue);box-shadow:0 0 14px #1457ff88;margin:14px 0 20px}h1{font-size:clamp(30px,4.6vw,50px);letter-spacing:-2px;margin:0 0 12px}p{color:#aabbd4;font-size:17px;margin:0}.figure{position:relative;display:grid;place-items:center;min-height:0}.halo{position:absolute;border:1px solid #2357a0;width:75%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 75px #0758d744}.ankh{position:relative;font:normal clamp(150px,24vw,250px) Georgia,serif;color:var(--kaliv-blue-light);text-shadow:0 0 16px #7da3ff,0 0 48px #1457ff}.figure .micro{position:absolute;bottom:10px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}button{background:#0b1729;border:1px solid #36557e;border-radius:12px;color:#fff;padding:14px 18px;text-align:left;min-height:64px;touch-action:manipulation}button strong{display:block;font-size:18px}button small{display:block;color:#a8bcd9;margin-top:5px;font-size:12px}button:active{background:#1c4183}button:focus-visible{outline:3px solid var(--kaliv-blue-light);outline-offset:2px}
#panel{display:none;position:absolute;inset:80px 24px 108px;background:#07101f;border-radius:16px;z-index:4;padding:16px;overflow:auto;border:1px solid #27406c}#panel.open{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:25px;margin:0}.head button{min-height:52px;padding:8px 20px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid #324e7b;padding:15px;min-height:98px;background:linear-gradient(145deg,#142944,#0b192e);border-radius:10px}.tile strong{font-size:17px;overflow-wrap:anywhere}.tile p{font-size:14px;margin-top:8px}
@media(max-width:700px){.shell{padding:0 14px 12px;grid-template-rows:60px minmax(0,1fr) 72px}.tiles{grid-template-columns:repeat(2,1fr)}#panel{inset:64px 12px 85px}button{padding:9px}button strong{font-size:15px}button small{font-size:10px}}
@media (min-width:900px) and (max-height:700px){.shell{grid-template-rows:58px minmax(0,1fr) 82px;padding:0 22px 12px;gap:6px}header b{font-size:20px}.copy #clock{font-size:104px}.copy h1{font-size:39px}.copy p{font-size:15px}.halo{width:min(70%,420px)}.ankh{font-size:210px}.figure .micro{bottom:0}nav button{min-height:66px;padding:10px 16px}#panel{inset:65px 22px 98px}.tile{min-height:85px}}
@media (min-width:900px) and (max-height:700px){.online{max-width:44%;text-align:right}#connection{overflow-wrap:anywhere}.head{margin-bottom:10px}.head h2{font-size:23px}.tiles{gap:8px}.tile{padding:12px}.tile strong{font-size:16px}.tile p{font-size:13px;margin-top:6px}nav button strong{font-size:17px}nav button small{font-size:11px}}
</style></head><body><div class="shell"><header><div><b>KALIV</b><div class="micro">MODELRIG / CAST INTERFACE</div></div><div class="online"><span id="indicator">●</span> <span id="connection">Afventer forbindelse</span></div></header>
<main><section class="copy"><div id="clock">--:--</div><div class="rule"></div><h1 id="greeting">Kaliv er her.</h1><p id="subtitle">Dit hjem. Din assistent. Én oplevelse.</p></section><section class="figure"><div class="halo"></div><span class="ankh" aria-label="Kaliv ankh">☥</span><span class="micro">KALIV / CAST</span></section></main>
<section id="panel" aria-label="Enhedsoversigt"><div class="head"><h2>Enheder</h2><button id="back">← Tilbage</button></div><div id="tiles" class="tiles"></div></section>
<nav><button id="devices"><strong>ENHEDER</strong><small>Kun visning</small></button><button id="assistant"><strong>KALIV</strong><small>Assistentstatus</small></button><button id="rest"><strong>RO</strong><small>Luk panelet</small></button></nav></div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let states=[],lastMessage=0;let lastSeq=-1;let sessionId=null;const MAX_ENTITIES=32;const allowed=new Set(['light','switch','sensor','binary_sensor','climate','cover','fan','input_boolean']);
function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});const h=now.getHours();$('greeting').textContent=h<10?'Godmorgen.':h<17?'Goddag.':'God aften.';if(lastMessage&&Date.now()-lastMessage>45000){$('connection').textContent='Forbindelsen er afbrudt';$('indicator').className='';states=[];lastMessage=0;sessionId=null;lastSeq=-1;render()}}
function safe(item){if(!item||typeof item!=='object'||typeof item.entity_id!=='string'||typeof item.name!=='string'||typeof item.state!=='string')return false;const id=item.entity_id.split('.');return id.length===2&&allowed.has(id[0])&&/^[a-z0-9_]{1,120}$/.test(id[1])&&item.name.length<=128&&item.state.length<=128&&!/[\u0000-\u001f]/.test(item.name+item.state)}
function snapshot(data){if(typeof data==='string'){try{data=JSON.parse(data)}catch{return}}if(!data||Array.isArray(data)||data.type!=='snapshot'||data.version!==1||!Array.isArray(data.entities)||data.entities.length>MAX_ENTITIES||!data.entities.every(safe)||new Set(data.entities.map(x=>x.entity_id)).size!==data.entities.length)return;if((data.session_id===undefined)!==(data.sequence===undefined))return;if(sessionId!==null&&data.session_id===undefined)return;if(data.session_id!==undefined){if(typeof data.session_id!=='string'||!/^[a-zA-Z0-9_-]{8,64}$/.test(data.session_id))return;if(sessionId!==data.session_id){if(sessionId!==null&&lastMessage&&Date.now()-lastMessage<=45000)return;sessionId=data.session_id;lastSeq=-1}}if(data.sequence!==undefined){if(!Number.isSafeInteger(data.sequence)||data.sequence<0||data.sequence<=lastSeq)return;lastSeq=data.sequence}states=data.entities.map(x=>({entity_id:x.entity_id,name:x.name,state:x.state}));lastMessage=Date.now();$('subtitle').textContent='Dit hjem. Din assistent. Én oplevelse.';$('connection').textContent='Forbundet · '+states.length+' enheder';$('indicator').className='ready';render()}
function render(){const root=$('tiles');root.replaceChildren();if(!states.length){const p=document.createElement('p');p.textContent='Ingen godkendte enheder modtaget';root.append(p);return}for(const item of states){const tile=document.createElement('div');tile.className='tile';const name=document.createElement('strong');name.textContent=item.name;const state=document.createElement('p');state.textContent=item.state;tile.append(name,state);root.append(tile)}}
$('devices').onclick=()=>{$('panel').classList.add('open');render()};$('back').onclick=$('rest').onclick=()=>$('panel').classList.remove('open');$('assistant').onclick=()=>{$('panel').classList.remove('open');$('subtitle').textContent='Cast-visning aktiv. Talefunktion kræver ModelRig-forbindelse.'};
tick();setInterval(tick,15000);
try{if(!window.cast||!cast.framework)throw Error('Cast SDK unavailable');const ctx=cast.framework.CastReceiverContext.getInstance();ctx.addCustomMessageListener('urn:x-cast:dk.kalivhub.lab',event=>{if(event&&event.data)snapshot(event.data)});ctx.start();$('connection').textContent='Receiver klar · afventer data'}catch{$('connection').textContent='Cast SDK ikke tilgængeligt'}
})();
</script></body></html>
